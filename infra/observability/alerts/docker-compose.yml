name: infrastructure-observability-alerts
services:
  obs-alertmanager:
    image: ${OBS_ALERTS_IMAGE:?Run alerts.py deploy}
    user: ${OBS_UID:?}:${OBS_GID:?}
    labels:
      org.agent-project.observability.owner: ${OBS_CONFIG_ID:?}
    network_mode: host
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 0.5
    mem_limit: 256m
    memswap_limit: 256m
    pids_limit: 64
    tmpfs:
      - "/tmp:size=16777216,mode=1777"
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --web.listen-address=127.0.0.1:16330
      - --cluster.listen-address=
      - --storage.path=/alertmanager
      - --data.retention=120h
    volumes:
      - type: bind
        source: ./alertmanager.yml
        target: /etc/alertmanager/alertmanager.yml
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${OBS_ALERTS_DATA:?}
        target: /alertmanager
        bind: {create_host_path: false}
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:16330/-/ready]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
