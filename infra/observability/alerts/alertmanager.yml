{
  "global": {
    "resolve_timeout": "5m"
  },
  "route": {
    "receiver": "ops-local-only",
    "group_by": [
      "alertname",
      "job",
      "instance"
    ],
    "group_wait": "30s",
    "group_interval": "5m",
    "repeat_interval": "4h"
  },
  "receivers": [
    {
      "name": "ops-local-only"
    }
  ]
}
