x-image: &n8n-image n8nio/n8n:2.40.5@sha256:9f693fd5565539efd5e75ad168526c8041a6af516d9e50bc4d9cb1c9c5031523
services:
  n8n:
    image: *n8n-image
    restart: unless-stopped
    networks: [flows-private, flows-api]
    ports:
      - '${N8N_BIND_HOST:-0.0.0.0}:${N8N_PORT:-16200}:5678'
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: flows-postgres
      DB_POSTGRESDB_DATABASE: flows
      DB_POSTGRESDB_USER: flows_service
      DB_POSTGRESDB_SCHEMA: n8n
      DB_POSTGRESDB_PASSWORD_FILE: /run/secrets/flows-db-app
      N8N_ENCRYPTION_KEY_FILE: /run/secrets/flows-encryption
      N8N_EDITOR_BASE_URL: ${N8N_PUBLIC_URL:-http://localhost:16200}
      WEBHOOK_URL: '${N8N_PUBLIC_URL:-http://localhost:16200}/'
      N8N_SECURE_COOKIE: ${N8N_SECURE_COOKIE:-false}
      GENERIC_TIMEZONE: Asia/Seoul
      TZ: Asia/Seoul
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: 'true'
      N8N_BLOCK_ENV_ACCESS_IN_NODE: 'true'
      N8N_BLOCK_FILE_ACCESS_TO_N8N_FILES: 'true'
      NODE_FUNCTION_ALLOW_BUILTIN: crypto
      N8N_COMMUNITY_PACKAGES_ENABLED: 'false'
      N8N_DIAGNOSTICS_ENABLED: 'false'
      N8N_VERSION_NOTIFICATIONS_ENABLED: 'false'
      N8N_PERSONALIZATION_ENABLED: 'false'
      EXECUTIONS_TIMEOUT: '720'
      EXECUTIONS_TIMEOUT_MAX: '720'
      EXECUTIONS_DATA_SAVE_ON_PROGRESS: 'true'
      EXECUTIONS_DATA_PRUNE: 'true'
      EXECUTIONS_DATA_MAX_AGE: '168'
      EXECUTIONS_DATA_PRUNE_MAX_COUNT: '1000'
    secrets: [flows-db-app, flows-encryption]
    volumes:
      - flows-data:/home/node/.n8n
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:5678/healthz/readiness').then(r=>{console.log('readiness HTTP '+r.status);process.exit(r.ok?0:1)}).catch(e=>{console.error(e.message);process.exit(1)})"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    depends_on:
      flows-postgres:
        condition: service_healthy
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
