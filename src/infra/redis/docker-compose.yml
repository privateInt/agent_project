name: ops-redis

services:
  redis:
    image: redis:8.10.1-alpine
    container_name: ops-redis
    restart: unless-stopped

    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec

    volumes:
      - redis-data:/data

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

    networks:
      - ops-infra

volumes:
  redis-data:

networks:
  ops-infra:
    external: true
    name: ops-infra
