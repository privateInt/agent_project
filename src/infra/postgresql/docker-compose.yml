name: postgresql

# ==============================================================================
# PostgreSQL + pgAdmin
#
# - 개별 Compose로 독립 실행할 수 있다.
# - 상위 infrastructure Compose에서도 include하여 실행할 수 있다.
# - PostgreSQL과 pgAdmin은 공용 ops-infra network를 사용한다.
# - ops-infra network는 외부에서 미리 생성되어 있어야 한다.
# ==============================================================================

services:

  # ============================================================================
  # PostgreSQL
  # ============================================================================
  postgres:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "${POSTGRES_HOST_PORT}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

    networks:
      - ops-infra


  # ============================================================================
  # pgAdmin
  # ============================================================================
  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    restart: unless-stopped

    env_file:
      - .env

    environment:
      # ------------------------------------------------------------------------
      # 사전 정의된 PostgreSQL 서버 등록
      # ------------------------------------------------------------------------
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
      PGADMIN_REPLACE_SERVERS_ON_STARTUP: "True"

      # pgAdmin 내부 PostgreSQL password file
      PGPASS_FILE: /pgadmin4/pgpass

      # 개발 환경에서는 pgAdmin 내부 Postfix를 사용하지 않음
      PGADMIN_DISABLE_POSTFIX: "True"

    ports:
      - "${PGADMIN_HOST_PORT}:80"

    volumes:
      - pgadmin_data:/var/lib/pgadmin

      # 사전 등록 서버 및 인증 정보
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
      - ./pgadmin/pgpass:/pgadmin4/pgpass:ro

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      # pgAdmin의 공식 ping endpoint가 HTTP 요청에 정상 응답하는지만 확인한다.
      #
      # 기존의 짧은 timeout에서는 pgAdmin 초기화 과정 중
      # 정상 서비스임에도 healthcheck timeout이 발생할 수 있어
      # timeout/start_period에 여유를 둔다.
      test:
        [
          "CMD",
          "wget",
          "-q",
          "--spider",
          "http://127.0.0.1:80/misc/ping"
        ]
      interval: 15s
      timeout: 15s
      retries: 5
      start_period: 60s

    networks:
      - ops-infra


# ==============================================================================
# Persistent Volumes
# ==============================================================================
volumes:
  postgres_data:
  pgadmin_data:


# ==============================================================================
# Shared Infrastructure Network
#
# 외부에서 생성된 ops-infra network를 사용한다.
# PostgreSQL Compose가 network lifecycle을 관리하지 않는다.
# ==============================================================================
networks:
  ops-infra:
    external: true
    name: ops-infra