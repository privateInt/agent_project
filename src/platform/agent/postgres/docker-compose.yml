services:
  agent-postgres:
    image: postgres:16-bookworm@sha256:efedf3595f1d6f415c08568ba171029bf54052e754cc9f030e3f2412b21f3d67
    restart: unless-stopped
    networks: [agent-private]
    environment:
      POSTGRES_USER: agent_admin
      POSTGRES_DB: agent_platform
      POSTGRES_PASSWORD_FILE: /run/secrets/agent-db-admin
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    secrets: [agent-db-admin, agent-db-app]
    volumes:
      - agent-db:/var/lib/postgresql/data
      - ./postgres/init-agent.sh:/docker-entrypoint-initdb.d/01-agent.sh:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U agent_admin -d agent_platform']
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt: [no-new-privileges:true]
