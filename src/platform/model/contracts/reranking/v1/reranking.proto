syntax = "proto3";
package model.reranking.v1;
option go_package = "model-platform/gen/reranking/v1;rerankingv1";

service RerankingService {
  rpc GetProfile(GetProfileRequest) returns (RerankerProfile);
  rpc Rerank(RerankRequest) returns (RerankResponse);
}
message GetProfileRequest { string deployment_id = 1; }
message RerankerProfile {
  string deployment_id = 1;
  string model_version_id = 2;
  string profile_id = 3;
  string reranker_profile_id = 4;
  string source_manifest_sha256 = 5;
  string tokenizer_sha256 = 6;
  string runtime_image_id = 7;
  string runtime_container_id = 8;
  string served_model_name = 9;
  string repo_id = 10;
  string resolved_revision = 11;
  string registered_model_type = 12;
  string score_kind = 13;
  string score_direction = 14;
  string pair_policy = 15;
  int32 max_input_tokens = 16;
  int32 max_candidates = 17;
  int32 max_input_bytes = 18;
  string truncation = 19;
  string capability = 20;
  string status = 21;
  string serving_profile = 22;
}
message Candidate { string id = 1; string text = 2; }
message RerankRequest {
  string deployment_id = 1;
  string expected_reranker_profile_id = 2;
  string query = 3;
  repeated Candidate candidates = 4;
}
message Score {
  string id = 1;
  int32 index = 2;
  double score = 3;
  int32 input_tokens = 4;
}
// Return every candidate in input order; Knowledge owns final ranking/top_k.
message RerankResponse { RerankerProfile profile = 1; repeated Score data = 2; }
