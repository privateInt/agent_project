# Included by ../docker-compose.yml with project_directory=model_platform.
# Use the root Compose entry point so sibling dependencies and the shared network resolve.
services:
  management:
    image: model-platform-management:dev
    build:
      context: .
      dockerfile: Dockerfile
      target: management
    pull_policy: never
    restart: unless-stopped
    networks:
    - ops-infra
    container_name: model-management
    command:
    - /app/management
    environment:
      POSTGRES_URL: ${MODEL_POSTGRES_URL}
      OPERATION_GRPC_ADDRESS: operation:9000
      CREDENTIAL_ENCRYPTION_KEY: ${MODEL_CREDENTIAL_ENCRYPTION_KEY}
      MINIO_BUCKET: ${MODEL_MINIO_BUCKET:-model-artifacts}
      MINIO_ENDPOINT: ${MODEL_MINIO_ENDPOINT:-ops-minio1:9000}
      MINIO_ACCESS_KEY: ${MODEL_MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MODEL_MINIO_SECRET_KEY}
      MINIO_USE_SSL: ${MODEL_MINIO_USE_SSL:-false}
      GRPC_ADDRESS: :9000
    depends_on:
    - operation
