[theme]
base = "light"
primaryColor = "#1262EE"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F0F4FA"
textColor = "#172B4D"
font = "sans serif"
[browser]
gatherUsageStats = false
[server]
headless = true
address = "0.0.0.0"
port = 8501
enableXsrfProtection = true
enableCORS = true
maxUploadSize = 32
[client]
toolbarMode = "minimal"
