syntax = "proto3";
package knowledge.indexing.v1;
option go_package = "knowledge-platform/gen/indexing/v1;indexingv1";
import "model/embedding/v1/embedding.proto";
service IndexingService {
 rpc CreateIndex(CreateIndexRequest) returns (JSONResponse);
 rpc ListIndexes(ListRequest) returns (JSONResponse);
 rpc GetIndex(IndexRequest) returns (JSONResponse);
 rpc CreateBuild(CreateBuildRequest) returns (JSONResponse);
 rpc ListVersions(ListRequest) returns (JSONResponse);
 rpc GetVersion(VersionRequest) returns (JSONResponse);
 rpc Activate(MutationRequest) returns (JSONResponse);
 rpc DeleteVersion(VersionRequest) returns (JSONResponse);
 rpc DeleteIndex(MutationRequest) returns (JSONResponse);
 // Synchronous vector search. Strict JSON preserves missing/null/filter-array semantics.
 rpc Search(SearchRequest) returns (JSONResponse);
 // Execution endpoints are internal only. No HTTP execution grants or document-vector writes.
 rpc PrepareBuild(ExecutionRequest) returns (JSONResponse);
 rpc ReadBatch(ReadBatchRequest) returns (JSONResponse);
 rpc CommitBatch(CommitBatchRequest) returns (JSONResponse);
 rpc FinishBuild(ExecutionRequest) returns (JSONResponse);
}
message JSONResponse { bytes json = 1; }
message SearchRequest { string index_id = 1; bytes query_json = 2; }
message CreateIndexRequest { string name = 1; string embedding_deployment_id = 2; string idempotency_key = 3; }
message IndexRequest { string index_id = 1; }
message VersionRequest { string index_version_id = 1; }
message ListRequest { string index_id = 1; int32 limit = 2; string cursor = 3; }
message CreateBuildRequest {
 string index_id = 1; string chunking_run_id = 2;
 bytes chunking_request_json = 3;
 repeated string canonical_ids = 4; // optional subset of the pinned ChunkSet
 string parent_version_id = 5; string embedding_deployment_id = 6;
 string idempotency_key = 7;
 bytes hnsw_json = 8; // optional strict JSON: m and ef_construction only
}
message MutationRequest { string index_id = 1; string index_version_id = 2; string expected_active_version_id = 3; int64 expected_revision = 4; }
message ExecutionRequest { string index_version_id = 1; string operation_id = 2; string dispatch_token = 3; string execution_instance_id = 4; }
message ReadBatchRequest { ExecutionRequest execution = 1; int32 offset = 2; }
message CommitBatchRequest { ExecutionRequest execution = 1; int32 offset = 2; model.embedding.v1.EmbedResponse result = 3; }
