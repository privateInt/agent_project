name: agent-n8n-operational-checks
services:
  operational-n8n:
    image: n8nio/n8n:2.40.5@sha256:9f693fd5565539efd5e75ad168526c8041a6af516d9e50bc4d9cb1c9c5031523
    environment:
      DB_TYPE: sqlite
      N8N_USER_FOLDER: /tmp/check-n8n
      N8N_ENCRYPTION_KEY: isolated-fixture-key-never-for-production
      N8N_SECURE_COOKIE: 'false'
      N8N_DIAGNOSTICS_ENABLED: 'false'
      N8N_VERSION_NOTIFICATIONS_ENABLED: 'false'
      N8N_PERSONALIZATION_ENABLED: 'false'
      N8N_COMMUNITY_PACKAGES_ENABLED: 'false'
      N8N_BLOCK_ENV_ACCESS_IN_NODE: 'true'
      NODE_FUNCTION_ALLOW_BUILTIN: crypto
      EXECUTIONS_DATA_PRUNE: 'false'
    tmpfs: ['/tmp:size=512m,mode=1777']
    networks: [checks]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:5678/healthz/readiness').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 60
  operational-checks:
    image: agent-platform-n8n-operational-checks:a07.1
    build:
      context: ../../../..
      dockerfile: agent_platform/n8n/tests/operational/Dockerfile
    environment:
      N8N_TEST_URL: http://operational-n8n:5678
      N8N_TEST_FIXTURE_HOST: operational-checks
    networks: [checks]
    tmpfs: ['/tmp:size=64m,mode=1777']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      operational-n8n:
        condition: service_healthy
networks:
  checks:
    internal: true
