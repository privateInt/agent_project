services:
  data-operation:
    image: data-platform-operation:dev
    build:
      context: .
      target: operation
    pull_policy: never
    container_name: data-operation
    restart: unless-stopped
    networks:
    - data-infra
    environment:
      POSTGRES_URL: ${DATA_POSTGRES_URL:?Run ops/configure.py first}
      KAFKA_BROKERS: ${DATA_KAFKA_BROKERS:?Run ops/configure.py first}
      KAFKA_COMMAND_TOPIC: data.operations.requested
